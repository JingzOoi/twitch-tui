name: Publish to Crates.io

on:
  release:
    types:
      - published

jobs:
  publish:
    # Only the upstream repository can publish, a release on a fork must not try.
    if: github.repository == 'Xithrius/twitch-tui'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - run: cargo login ${CRATES_IO_TOKEN}
        env:
            CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - run: cargo publish --allow-dirty
